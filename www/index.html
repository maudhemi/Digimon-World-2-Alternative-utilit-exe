<style>

*,*::before,*::after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow-x:hidden}
header{padding:14px 14px 0}h1{margin:0 0 4px;font-size:1.35rem;font-family:Georgia,"Times New Roman",serif;letter-spacing:.2px}
.sub{color:var(--mu);font-size:.92rem;margin:0 0 10px}
.dl{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:2px solid var(--ac);color:var(--ac);border-radius:8px;text-decoration:none;font-weight:700}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--ln)}
nav button{flex:0 0 auto}
button,input{font:inherit;color:var(--tx)}
button{min-height:44px;min-width:44px;padding:0 14px;background:var(--s1);border:1px solid var(--ln);border-radius:8px;cursor:pointer}
button[aria-pressed=true],nav button.on{background:var(--ac);color:#0a1230;border-color:var(--ac);font-weight:700}
input[type=search]{width:100%;min-height:44px;padding:0 12px;background:var(--s1);border:2px solid var(--ln);border-radius:8px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
main{padding:14px;max-width:1200px;margin:0 auto}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:800px){.grid{grid-template-columns:minmax(260px,340px) minmax(0,1fr)}}
.list{max-height:60vh;overflow-y:auto;border:1px solid var(--ln);border-radius:8px;background:var(--s1)}
.list button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--ln);border-radius:0;background:none}
.list button[aria-current=true]{background:var(--s2);box-shadow:inset 4px 0 var(--ac)}
.list small{margin-left:auto;color:var(--mu)}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:1rem;color:var(--ac)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}th{color:var(--mu)}
.lk{background:none;border:0;padding:0;min-height:44px;color:var(--ac);text-decoration:underline;font-weight:700}
.empty{color:var(--mu);padding:12px}.t-Data{color:var(--data)}.t-Vaccine{color:var(--vac)}.t-Virus{color:var(--vir)}
ul.tree,ul.tree ul{list-style:none;margin:0;padding-left:14px;border-left:2px solid var(--ln)}ul.tree{border:0;padding:0}
.dp{color:var(--mu);font-size:.8rem}.step{padding:4px 0}
details{margin:6px 0}summary{min-height:44px;display:flex;align-items:center;cursor:pointer}
.ok{color:var(--vac)}
.dnat td{font-size:.78rem;min-width:92px}.dnat .hit{background:var(--ac);color:#0a1230;font-weight:700}.dnat [data-mon]{cursor:pointer;text-decoration:underline}
.gw{overflow-x:auto;border:1px solid var(--ln);border-radius:8px;background:var(--bg)}.gw svg{display:block}
.gw g[data-mon]{cursor:pointer}.gw g[data-mon]:focus-visible{outline:none}.gw g[data-mon]:focus-visible rect{stroke:var(--ac);stroke-width:4}.gw g[data-mon]:hover rect{fill:#22337a}
